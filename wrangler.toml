name = "pagefly"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────
# 通过 Cloudflare Pages 控制台「连接 GitHub 仓库」部署时，
# KV 绑定在控制台配置（git 部署不读取本文件）：
#   Pages 项目 → Settings → Functions → KV namespace bindings
#   添加绑定：变量名(binding) = PAGEDROP_KV，命名空间选你创建的那个。
#
# 若改用 `wrangler pages deploy` 本地部署，请在本文件补回：
#   [[kv_namespaces]]
#   binding = "PAGEDROP_KV"
#   id = "<你的 KV 命名空间 ID>"
# （该 ID 为账号专属，勿提交进开源仓库）
# ─────────────────────────────────────────────────────────────
