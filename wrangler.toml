name = "pagefly"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────
# KV 绑定：只声明 binding 名 PAGEDROP_KV，命名空间 ID 用环境变量注入（不硬编码进仓库）。
#
# 两种部署方式任选其一：
#
# ① 控制台「连接 GitHub 仓库」部署（推荐，当前用法）
#    本文件的 KV 块在 git 部署时不会被读取，KV 仍在控制台绑定：
#      Pages 项目 → Settings → Functions → KV namespace bindings
#      添加绑定：变量名(binding) = PAGEDROP_KV，命名空间选你创建的那个。
#
# ② 本地 / CI 用 `wrangler pages deploy` 部署
#    部署前注入环境变量（仅本机内存，勿提交到仓库）：
#      PAGEDROP_KV_ID=你的命名空间ID wrangler pages deploy public
#    开发期也可在 .dev.vars 写一行 PAGEDROP_KV_ID=xxx（.dev.vars 已加入 .gitignore）。
#    注：一旦用本文件部署，KV 绑定以本文件为准，控制台的同字段编辑会被忽略。
# ─────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "PAGEDROP_KV"
