name = "pagefly"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────
# KV 绑定
#
# 控制台连 GitHub 仓库部署（推荐，当前用法）：本文件【不放】 kv 块，
# KV 在控制台绑定，仓库零账号信息：
#   Pages 项目 → Settings → Functions → KV namespace bindings
#   添加绑定：变量名(binding) = PAGEDROP_KV，命名空间选你创建的那个。
#
# 若改用 `wrangler pages deploy` 本地/CI 部署，可用环境变量注入 ID（取消下方注释）：
#   PAGEDROP_KV_ID=你的命名空间ID wrangler pages deploy public
# 注意：控制台 git 部署的构建环境没有该 shell 变量，${...} 不会被替换，会报
# “Invalid KV namespace ID” —— 所以控制台部署请不要启用下面这块。
# ─────────────────────────────────────────────────────────────

# [[kv_namespaces]]
# binding = "PAGEDROP_KV"
# id = "${PAGEDROP_KV_ID}"
