name = "pagefly"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────
# 重要：通过 Cloudflare Pages 控制台「连接 GitHub 仓库」部署时，
# 下面这个 [[kv_namespaces]] 绑定【不会被读取】。
# git 部署的 Pages 项目，KV 绑定只认控制台配置：
#   Pages 项目 → Settings → Functions → KV namespace bindings
#   添加绑定：变量名(binding) = PAGEDROP_KV，命名空间选你创建的那个。
#
# 下面这个块仅在使用 `wrangler pages deploy` 本地部署时生效。
# 如果你只用控制台 git 部署，可忽略它，但留着也无害。
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "PAGEDROP_KV"
id = "6f81dc51ac6b4c0ab7ad1ca173eb640e"
