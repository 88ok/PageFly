<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PageFly · 部署自定义 HTML 页面的最简方式</title>
<meta name="description" content="PageFly —— 为静态内容而生的极简托管页。一次上传，随处访问。" />
<style>
  :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e7e9f0;
    --brand:#6366f1;
    --brand-2:#8b5cf6;
    --brand-ink:#4f46e5;
    --brand-bg:rgba(99,102,241,.10);
    --ok:#16a34a;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(79,70,229,.18);
    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 4px 14px -8px rgba(15,23,42,.12);
    --shadow-brand:0 10px 24px -10px rgba(99,102,241,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(139,92,246,.10), transparent 60%),
      radial-gradient(1000px 500px at 0% 0%, rgba(99,102,241,.10), transparent 55%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* nav */
  nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px;text-decoration:none;color:var(--ink);}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:var(--shadow-sm);}
  .brand .mark svg{width:17px;height:17px;color:#fff;}
  .nav-links{display:flex;align-items:center;gap:18px;font-size:14px;}
  .nav-links a{color:var(--muted);text-decoration:none;transition:color .15s;}
  .nav-links a:hover{color:var(--ink);}

  /* hero */
  header.hero{padding:28px 0 14px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);font-size:13px;color:var(--brand-ink);font-weight:600;letter-spacing:.3px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));}
  h1{font-size:clamp(30px,5vw,46px);line-height:1.12;margin:16px 0 10px;font-weight:800;letter-spacing:-.5px;}
  h1 .grad{background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:17px;color:var(--muted);margin:0 auto;max-width:560px;line-height:1.6;}

  /* publish card */
  .card{margin:22px auto 0;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-align:left;}
  .card-body{padding:24px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;}
  .field input.title{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);background:#fbfbfe;outline:0;transition:.15s;}
  .field input.title:focus{border-color:var(--brand);background:#fff;}

  /* upload / paste area */
  .area{border:1.5px dashed #d1d5db;border-radius:16px;background:#fff;overflow:hidden;transition:.18s;}
  .area.drag{border-color:var(--brand);background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(139,92,246,.05));}
  .upload-zone{padding:32px 28px;text-align:center;cursor:pointer;}
  .upload-zone .ic{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:var(--brand-bg);color:var(--brand-ink);}
  .upload-zone .ic svg{width:28px;height:28px;}
  .upload-zone h3{margin:0 0 6px;font-size:18px;font-weight:700;color:var(--ink);}
  .upload-zone p{margin:0 0 18px;font-size:13px;color:var(--muted);}
  .btn-orange{border:0;cursor:pointer;font-size:14px;font-weight:600;padding:12px 22px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-brand);transition:transform .12s, box-shadow .15s;display:inline-flex;align-items:center;gap:8px;}
  .btn-orange:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(99,102,241,.55);}
  .btn-orange:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .paste-zone{display:none;padding:18px 18px 0;}
  .paste-zone textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:12px;outline:0;padding:16px;font:13px/1.6 "SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:#fbfbfe;display:block;}
  .paste-zone textarea:focus{border-color:var(--brand);background:#fff;}
  .area.paste .upload-zone{display:none;}
  .area.paste .paste-zone{display:block;}
  .area.paste{border-style:solid;border-color:var(--line);background:#fbfbfe;}

  /* file name hint */
  .file-hint{font-size:13px;color:var(--muted);margin-top:12px;text-align:center;}
  .file-hint b{color:var(--ink);font-weight:600;}

  /* bottom bar */
  .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;}
  .toggle{color:var(--muted);font-size:13px;background:transparent;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 0;transition:.15s;}
  .toggle:hover{color:var(--brand-ink);}
  .toggle svg{width:15px;height:15px;color:var(--brand);}
  .publish{border:0;cursor:pointer;font-size:15px;font-weight:700;padding:13px 26px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-brand);transition:transform .12s, box-shadow .15s;display:inline-flex;align-items:center;gap:8px;}
  .publish:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(99,102,241,.55);}
  .publish:disabled{opacity:.55;cursor:not-allowed;transform:none;}

  /* modal */
  .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:20px;}
  .modal.show{display:flex;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal-card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 30px;text-align:center;animation:slide .22s ease;}
  @keyframes slide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .check{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#dcfce7;color:var(--ok);display:grid;place-items:center;}
  .check svg{width:32px;height:32px;}
  .modal-card h2{margin:0 0 8px;font-size:22px;font-weight:800;}
  .modal-card .desc{margin:0 0 22px;color:var(--muted);font-size:14px;}
  .link-box{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:22px;}
  .link-box input{flex:1;border:0;background:transparent;font:13px ui-monospace,monospace;color:var(--ink);outline:0;min-width:0;}
  .btn-copy{border:0;background:#1e293b;color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn-copy:hover{background:#334155;}
  .modal-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .modal-actions .ghost{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;padding:11px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .modal-actions .ghost:hover{border-color:var(--brand);color:var(--brand-ink);}

  /* features */
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:56px 0 12px;}
  .feat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow-sm);}
  .feat .fi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12));color:var(--brand-ink);margin-bottom:12px;}
  .feat h3{margin:0 0 6px;font-size:15.5px;}
  .feat p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:34px 0 46px;}
  footer a{color:var(--muted);text-decoration:none;}
  @media (max-width:720px){
    .features{grid-template-columns:1fr;}
    .card-body{padding:22px;}
    .upload-zone{padding:30px 20px;}
    .actions{flex-direction:column-reverse;align-items:stretch;}
    .toggle{justify-content:center;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </span>
        PageFly
      </a>
    </nav>

    <header class="hero">
      <span class="eyebrow"><span class="dot"></span>为静态内容而生的 · 极简 · 托管页</span>
      <h1>部署自定义 HTML 页面<br>的<span class="grad">最简方式</span></h1>
      <p class="sub">一次上传，随处访问。</p>

      <div class="card">
        <div class="card-body">
          <div class="field">
            <label for="pageTitle">网页标题（选填）</label>
            <input type="text" id="pageTitle" class="title" placeholder="例如：我的产品落地页" />
          </div>

          <div class="area" id="area">
            <div class="upload-zone" id="uploadZone">
              <div class="ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
              </div>
              <h3>点击上传 HTML</h3>
              <p>支持拖拽 .html 文件至此处</p>
              <button class="btn-orange" id="pickBtn" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                点击选择本地 HTML 文件
              </button>
              <div class="file-hint" id="fileHint"></div>
            </div>
            <div class="paste-zone" id="pasteZone">
              <textarea id="code" placeholder="<!-- 在此粘贴你的 HTML 代码 -->&#10;<h1>Hello PageFly</h1>"></textarea>
            </div>
          </div>

          <div class="actions">
            <button class="toggle" id="modeToggle" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              <span id="modeLabel">切换为直接粘贴 HTML 代码</span>
            </button>
            <button class="publish" id="publishBtn" type="button">
              确认发布
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="features">
      <div class="feat">
        <div class="fi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
        <h3>全球 CDN 加速访问</h3>
        <p>依托 Cloudflare 边缘网络，访客就近接入，全球秒级打开。</p>
      </div>
      <div class="feat">
        <div class="fi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>
        <h3>一次上传，永久在线</h3>
        <p>免服务器、免构建，纯静态托管，链接长期有效。</p>
      </div>
      <div class="feat">
        <div class="fi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></div>
        <h3>链接即分享</h3>
        <p>自动生成专属链接，复制即可发给任何人，随处打开。</p>
      </div>
    </section>

    <footer>
      © 2026 PageFly 页面托管 &nbsp;·&nbsp; <a href="/">上传一个页面试试 →</a>
    </footer>
  </div>

  <!-- success modal -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>网页生成成功！</h2>
      <p class="desc">您可直接复制下方分享链接在任何浏览器中打开：</p>
      <div class="link-box">
        <input id="resultUrl" readonly />
        <button class="btn-copy" id="resultCopy">复制链接</button>
      </div>
      <div class="modal-actions">
        <a class="ghost" id="resultPreview" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          在新标签页预览
        </a>
        <button class="ghost" id="resultAgain" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          继续上传另一个 HTML
        </button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const state = {
    mode: 'upload', // 'upload' | 'paste'
    html: '',
    title: '',
  };

  const els = {
    area: $('area'),
    uploadZone: $('uploadZone'),
    pasteZone: $('pasteZone'),
    code: $('code'),
    pageTitle: $('pageTitle'),
    fileHint: $('fileHint'),
    modeToggle: $('modeToggle'),
    modeLabel: $('modeLabel'),
    publishBtn: $('publishBtn'),
    pickBtn: $('pickBtn'),
    modal: $('modal'),
    resultUrl: $('resultUrl'),
    resultCopy: $('resultCopy'),
    resultPreview: $('resultPreview'),
    resultAgain: $('resultAgain'),
  };

  // 文件选择
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = '.html,text/html';
  els.pickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => readFile(fileInput.files[0]));

  // 拖拽
  ['dragenter','dragover'].forEach(ev => els.area.addEventListener(ev, e => { e.preventDefault(); els.area.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => els.area.addEventListener(ev, e => { e.preventDefault(); els.area.classList.remove('drag'); }));
  els.area.addEventListener('drop', e => {
    if (state.mode !== 'upload') setMode('upload');
    const f = e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  async function readFile(f){
    if (!f) return;
    const text = await f.text();
    state.html = text;
    els.fileHint.innerHTML = '已选择文件：<b>' + escapeHtml(f.name) + '</b>，点击「确认发布」即可生成链接';
    // 如果标题为空且 HTML 里有 title，自动填上
    const t = extractTitle(text);
    if (!els.pageTitle.value.trim() && t) els.pageTitle.value = t;
  }

  function extractTitle(html){
    const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (!m) return '';
    return m[1].replace(/<[^>]+>/g, ' ').replace(/[\s\r\n]+/g, ' ').trim();
  }

  function escapeHtml(str){
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 切换模式
  function setMode(mode){
    state.mode = mode;
    els.area.classList.toggle('paste', mode === 'paste');
    els.modeLabel.textContent = mode === 'upload'
      ? '切换为直接粘贴 HTML 代码'
      : '切换为上传本地 HTML 文件';
    if (mode === 'paste') {
      setTimeout(() => els.code.focus(), 50);
    }
  }

  els.modeToggle.addEventListener('click', () => setMode(state.mode === 'upload' ? 'paste' : 'upload'));

  // 粘贴区输入变化
  els.code.addEventListener('input', () => {
    state.html = els.code.value;
    const t = extractTitle(state.html);
    if (!els.pageTitle.value.trim() && t) els.pageTitle.value = t;
  });

  // 发布
  async function publish(){
    const html = state.mode === 'paste' ? els.code.value : state.html;
    if (!html.trim()) { alert('请先粘贴 HTML 或选择文件'); return; }

    const title = els.pageTitle.value.trim();
    els.publishBtn.disabled = true; els.publishBtn.textContent = '发布中…';
    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ html, title })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'error');

      els.resultUrl.value = data.url;
      els.resultPreview.href = data.url;
      els.modal.classList.add('show');
    } catch (err) {
      alert('发布失败：' + err.message);
    } finally {
      els.publishBtn.disabled = false; els.publishBtn.innerHTML = '确认发布 <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
    }
  }

  els.publishBtn.addEventListener('click', publish);

  // 复制结果链接
  els.resultCopy.addEventListener('click', async () => {
    await navigator.clipboard.writeText(els.resultUrl.value);
    const t = els.resultCopy.textContent;
    els.resultCopy.textContent = '已复制✓';
    setTimeout(() => els.resultCopy.textContent = t, 1500);
  });

  // 继续上传：关闭弹窗并清空表单
  els.resultAgain.addEventListener('click', () => {
    els.modal.classList.remove('show');
    state.html = '';
    els.code.value = '';
    els.fileHint.innerHTML = '';
    els.pageTitle.value = '';
    setMode('upload');
  });

  // 点击遮罩关闭弹窗
  els.modal.addEventListener('click', (e) => {
    if (e.target === els.modal) els.resultAgain.click();
  });
</script>
</body>
</html>
