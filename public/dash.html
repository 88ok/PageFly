<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理后台 · PageFly</title>
<meta name="description" content="PageFly 管理后台 —— 管理已发布的页面" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<style>
  :root{
    --bg:#f6f7fb;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e7e9f0;
    --brand:#6366f1;--brand-2:#8b5cf6;--brand-ink:#4f46e5;--brand-bg:rgba(99,102,241,.10);
    --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(79,70,229,.18);
    --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 4px 14px -8px rgba(15,23,42,.12);
    --shadow-brand:0 10px 24px -10px rgba(99,102,241,.45);
    --danger:#ef4444;--danger-bg:rgba(239,68,68,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 48px;}

  /* nav */
  nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px;text-decoration:none;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:var(--shadow-sm);}
  .brand .mark svg{width:17px;height:17px;color:#fff;}
  .btn{font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--brand);color:var(--brand-ink);}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;color:#fff;box-shadow:var(--shadow-brand);}
  .btn.primary:hover{color:#fff;opacity:.95;}
  .btn.danger{color:var(--danger);border-color:#f3c9c9;}
  .btn.danger:hover{background:var(--danger-bg);border-color:var(--danger);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--brand-ink);background:var(--brand-bg);}

  /* login */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
  .login-card .lock{width:48px;height:48px;border-radius:12px;background:var(--brand-bg);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto 14px;}
  .login-card h1{font-size:20px;margin:0 0 6px;}
  .login-card input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none;transition:.15s;}
  .login-card input[type=password]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg);}
  .login-card .btn.primary{width:100%;justify-content:center;margin-top:14px;padding:13px;}
  .login-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;}

  /* dashboard */
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 18px;flex-wrap:wrap;}
  .head h1{font-size:22px;margin:0;font-weight:800;}
  .head .count{color:var(--muted);font-size:14px;font-weight:500;margin-left:8px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:48px;text-align:center;color:var(--muted);}
  .empty a{color:var(--brand-ink);font-weight:600;}

  .list{display:flex;flex-direction:column;gap:12px;}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;}
  .row .main{flex:1;min-width:0;}
  .row .title{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .meta{margin-top:4px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row .id{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f3f9;padding:2px 8px;border-radius:6px;font-size:12px;color:#475569;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px;background:#eef0ff;color:var(--brand-ink);}
  .badge.md{background:#f0fdf4;color:#15803d;}
  .row .acts{display:flex;gap:8px;flex-wrap:wrap;}

  @media (max-width:640px){
    .row{flex-direction:column;align-items:stretch;}
    .row .acts{justify-content:flex-end;}
  }

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .overlay.show{display:flex;}
  .modal{width:100%;max-width:760px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 24px 22px;}
  .modal h2{margin:0 0 16px;font-size:18px;display:flex;align-items:center;justify-content:space-between;}
  .modal h2 .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:transparent;padding:4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field .row2{display:flex;gap:12px;flex-wrap:wrap;}
  .field .row2 > *{flex:1;min-width:200px;}
  .field input[type=text],.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;}
  .field input[type=text]:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg);}
  textarea#editContent{width:100%;height:46vh;min-height:240px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical;outline:none;}
  textarea#editContent:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg);}
  .modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .modal-msg{font-size:13px;color:var(--danger);min-height:18px;margin-right:auto;align-self:center;}

  /* toast */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- 登录视图 -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="lock">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>管理后台</h1>
    <input type="password" id="pwInput" placeholder="管理密码" autocomplete="current-password" />
    <button class="btn primary" id="loginBtn" type="button">进入后台</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 后台视图 -->
<div class="wrap" id="dashView" style="display:none;">
  <nav>
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span>
      PageFly 管理后台
    </a>
    <button class="btn ghost" id="logoutBtn" type="button">退出登录</button>
  </nav>

  <div class="head">
    <h1>已发布页面<span class="count" id="pageCount"></span></h1>
    <div class="toolbar">
      <a class="btn primary" href="/">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>
        新建页面
      </a>
      <button class="btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        刷新
      </button>
    </div>
  </div>

  <div id="listArea"></div>
</div>

<!-- 编辑弹窗 -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>编辑页面 <button class="x" id="editClose" type="button">&times;</button></h2>
    <input type="hidden" id="editId" />
    <div class="field">
      <label>类型</label>
      <select id="editType">
        <option value="html">HTML</option>
        <option value="md">Markdown</option>
      </select>
    </div>
    <div class="field">
      <label>内容（HTML 或 Markdown 源码）</label>
      <textarea id="editContent" spellcheck="false" placeholder="在此编辑页面源码…"></textarea>
    </div>
    <div class="field">
      <label>修改 ID（可选，留空保持不变；更改后旧链接失效）</label>
      <input type="text" id="editNewId" placeholder="例如：mypage" autocomplete="off" />
    </div>
    <div class="modal-acts">
      <span class="modal-msg" id="editMsg"></span>
      <button class="btn" id="editCancel" type="button">取消</button>
      <button class="btn primary" id="editSave" type="button">保存修改</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fmtDate(ts){
    if(!ts) return "—";
    try{ return new Date(ts).toLocaleString("zh-CN",{hour12:false}); }catch{ return "—"; }
  }
  let toastTimer;
  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"),2200);
  }

  const api = {
    login: (pw)=>fetch("/api/dash/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})}),
    logout: ()=>fetch("/api/dash/logout",{method:"POST"}),
    pages: ()=>fetch("/api/dash/pages"),
    get:   (id)=>fetch("/api/dash/get?id="+encodeURIComponent(id)),
    del:   (id)=>fetch("/api/dash/delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id})}),
    update:(p)=>fetch("/api/dash/update",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)}),
  };

  // 进入即尝试拉列表：401 → 显示登录；200 → 显示后台
  async function boot(){
    const res = await api.pages();
    if(res.status === 401){ showLogin(); return; }
    if(res.ok){ showDash(); await loadPages(); return; }
    // 其它错误（如 kv 未绑定）
    const d = await res.json().catch(()=>({}));
    showLogin();
    $("loginErr").textContent = d.message || ("加载失败（"+res.status+"）");
  }

  function showLogin(){ $("loginView").style.display="flex"; $("dashView").style.display="none"; }
  function showDash(){ $("loginView").style.display="none"; $("dashView").style.display="block"; $("pwInput").value=""; $("loginErr").textContent=""; }

  async function doLogin(){
    const pw = $("pwInput").value;
    if(!pw){ $("loginErr").textContent="请输入密码"; return; }
    $("loginBtn").disabled = true;
    try{
      const res = await api.login(pw);
      const d = await res.json().catch(()=>({}));
      if(res.ok){ showDash(); await loadPages(); }
      else { $("loginErr").textContent = d.message || "登录失败"; }
    }catch(e){ $("loginErr").textContent = "网络错误"; }
    finally{ $("loginBtn").disabled = false; }
  }

  async function loadPages(){
    const res = await api.pages();
    if(res.status === 401){ showLogin(); return; }
    const d = await res.json().catch(()=>({pages:[]}));
    renderPages(d.pages || []);
  }

  function renderPages(pages){
    $("pageCount").textContent = pages.length ? "（共 "+pages.length+" 个）" : "";
    const area = $("listArea");
    if(!pages.length){
      area.innerHTML = '<div class="empty">还没有已发布的页面。<br>前往 <a href="/">首页</a> 上传你的第一个页面。</div>';
      return;
    }
    area.innerHTML = '<div class="list">'+pages.map(rowHtml).join("")+'</div>';
    area.querySelectorAll("[data-act]").forEach(btn=>{
      btn.addEventListener("click",()=>handleAct(btn.getAttribute("data-act"), btn.getAttribute("data-id")));
    });
  }

  function rowHtml(p){
    const origin = location.origin;
    const badge = p.type === "md" ? '<span class="badge md">Markdown</span>' : '<span class="badge">HTML</span>';
    return `<div class="row">
      <div class="main">
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="meta">
          ${badge}
          <span class="id">${escapeHtml(p.id)}</span>
          <span>${fmtDate(p.createdAt)}</span>
        </div>
      </div>
      <div class="acts">
        <a class="btn" href="${origin}/v/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">预览</a>
        <button class="btn" data-act="copy" data-id="${escapeHtml(p.id)}">复制链接</button>
        <button class="btn" data-act="edit" data-id="${escapeHtml(p.id)}">编辑</button>
        <button class="btn danger" data-act="del" data-id="${escapeHtml(p.id)}">删除</button>
      </div>
    </div>`;
  }

  async function handleAct(act, id){
    if(act === "copy"){
      const url = location.origin+"/v/"+id;
      try{ await navigator.clipboard.writeText(url); toast("已复制链接"); }
      catch{ toast(url); }
      return;
    }
    if(act === "edit"){ return openEdit(id); }
    if(act === "del"){
      if(!confirm("确定删除页面「"+id+"」？此操作不可恢复。")) return;
      const res = await api.del(id);
      if(res.ok){ toast("已删除"); await loadPages(); }
      else { const d = await res.json().catch(()=>({})); toast(d.message || "删除失败"); }
    }
  }

  async function openEdit(id){
    $("editMsg").textContent=""; $("editId").value=id; $("editNewId").value="";
    const res = await api.get(id);
    if(res.status === 401){ showLogin(); return; }
    const d = await res.json().catch(()=>({}));
    if(!res.ok || !d.page){ toast(d.message || "读取失败"); return; }
    $("editType").value = d.page.type === "md" ? "md" : "html";
    $("editContent").value = d.page.raw || "";
    $("editOverlay").classList.add("show");
    setTimeout(()=>$("editContent").focus(),50);
  }

  async function saveEdit(){
    const id = $("editId").value;
    const content = $("editContent").value;
    const type = $("editType").value;
    const newId = $("editNewId").value.trim();
    if(!content.trim()){ $("editMsg").textContent="内容不能为空"; return; }
    $("editSave").disabled = true;
    try{
      const res = await api.update({id, content, type, newId});
      const d = await res.json().catch(()=>({}));
      if(res.ok){
        $("editOverlay").classList.remove("show");
        toast(newId && newId !== id ? "已保存，ID 已更改为 "+d.id : "已保存修改");
        await loadPages();
      } else if(res.status === 409){
        $("editMsg").textContent = d.message || "新 ID 已存在";
      } else {
        $("editMsg").textContent = d.message || "保存失败";
      }
    }catch(e){ $("editMsg").textContent = "网络错误"; }
    finally{ $("editSave").disabled = false; }
  }

  function closeEdit(){ $("editOverlay").classList.remove("show"); }

  // 事件绑定
  $("loginBtn").addEventListener("click", doLogin);
  $("pwInput").addEventListener("keydown",(e)=>{ if(e.key==="Enter") doLogin(); });
  $("logoutBtn").addEventListener("click", async ()=>{ await api.logout(); showLogin(); });
  $("refreshBtn").addEventListener("click", loadPages);
  $("editSave").addEventListener("click", saveEdit);
  $("editCancel").addEventListener("click", closeEdit);
  $("editClose").addEventListener("click", closeEdit);
  $("editOverlay").addEventListener("click",(e)=>{ if(e.target === $("editOverlay")) closeEdit(); });

  boot();
</script>
</body>
</html>
